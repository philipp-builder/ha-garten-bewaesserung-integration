name: Validate
on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # score.py ist bewusst HA-frei — die Paritätstests laufen ohne
      # jegliche Abhängigkeiten (kein pip install nötig).
      - run: python3 tests/test_score.py
      - run: python3 tests/test_pause.py
      - name: Pause cancellation race in the HA runtime
        run: |
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            -v "$PWD:/work:ro" --entrypoint python \
            ghcr.io/home-assistant/home-assistant:2026.9.2 /work/tests/test_pause_race.py
